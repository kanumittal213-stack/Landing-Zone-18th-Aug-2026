name: Terraform DevSecOps Pipeline

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - feature/dev

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"

jobs:

  # ==========================================================
  # JOB 1: TERRAFORM VALIDATION + SECURITY SCAN + PLAN
  # ==========================================================

  terraform-plan:

    name: Terraform Plan & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Configure Terraform Azure Service Principal
      # ------------------------------------------------------

      - name: Configure Terraform Azure Credentials
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> "$GITHUB_ENV"


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # ======================================================
      # TFLINT
      # ======================================================

      # - name: Setup TFLint
      #   uses: terraform-linters/setup-tflint@v4

      # - name: Run TFLint
      #   run: |
      #     tflint --init
      #     tflint


      # ======================================================
      # CHECKOV
      # ======================================================

      # - name: Run Checkov
      #   uses: bridgecrewio/checkov-action@v12
      #   with:
      #     directory: environments/dev
      #     framework: terraform
      #     soft_fail: false


      # ======================================================
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # ------------------------------------------------------
      # Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: environments/dev/tfplan


  # ==========================================================
  # JOB 2: TERRAFORM APPLY
  # ==========================================================

  terraform-apply:

    name: Terraform Apply

    needs: terraform-plan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: dev

    defaults:
      run:
        working-directory: environments/dev

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Configure Terraform Azure Service Principal
      # ------------------------------------------------------

      - name: Configure Terraform Azure Credentials
        shell: bash
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> "$GITHUB_ENV"


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Download Plan
      # ------------------------------------------------------

      # - name: Download Terraform Plan
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: terraform-plan
      #     path: environments/dev


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve